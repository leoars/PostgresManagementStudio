# Dependabot: keeps NuGet packages and pinned GitHub Actions current.
# Lock files (packages.lock.json) are regenerated by Dependabot pull requests.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dotnet-extensions:
        patterns:
          - "Microsoft.Extensions.*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
