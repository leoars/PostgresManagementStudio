# Continuous integration: restore with locked dependencies and build the solution
# in Release on Windows, then run the public documentation consistency check.
# Database and WPF test suites need an isolated PostgreSQL cluster and a desktop
# session, so they remain local; see docs/en/development.md.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: global.json

      - name: Build (Release, locked restore)
        shell: pwsh
        run: ./scripts/Build.ps1 -Configuration Release

      - name: Check public documentation
        shell: pwsh
        run: ./scripts/Test-PublicDocumentation.ps1
