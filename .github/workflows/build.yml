# Continuous integration: restore with locked dependencies and build the solution
# in Release on Windows, then run the public documentation consistency check.
# Database and WPF test suites need an isolated PostgreSQL cluster and a desktop
# session, so they remain local; see docs/en/development.md.
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET SDK from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Build (Release, locked restore)
        shell: pwsh
        run: ./scripts/Build.ps1 -Configuration Release

      - name: Check public documentation
        shell: pwsh
        run: ./scripts/Test-PublicDocumentation.ps1
